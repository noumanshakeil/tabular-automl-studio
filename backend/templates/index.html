<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head>
<body><main>
<h1>{{ title }}</h1>
<p class="sub">Run stub AutoML jobs and pick a leaderboard winner.</p>
<div class="grid">
<section class="card">
  <form method="post" action="/ui/jobs"><label>Job name</label><input name="name" required/>
  <label>Dataset URI</label><input name="dataset_uri" value="file://data/train.csv"/><button type="submit">Launch</button></form>
  <ul>{% for j in jobs %}<li><a href="/?job_id={{ j.id }}">{{ j.name }}</a> <span class="pill">{{ j.status }}</span></li>{% endfor %}</ul>
</section>
<section class="card">
  <h2>Leaderboard</h2>
  {% for c in board %}
  <div class="card" style="margin:.3rem 0">
    {% if c.selected %}<span class="pill">winner</span>{% endif %}
    {{ c.name }} · acc {{ c.accuracy }} · f1 {{ c.f1 }}
    <form method="post" action="/ui/select"><input type="hidden" name="job_id" value="{{ job_id }}"/>
    <input type="hidden" name="candidate_id" value="{{ c.id }}"/><button type="submit">Select</button></form>
  </div>
  {% endfor %}
</section>
</div></main></body></html>
