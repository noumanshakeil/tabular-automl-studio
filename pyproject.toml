[project]
name = "tabular-automl-studio"
version = "2.0.0"
description = "Launch tabular AutoML jobs, track candidate metrics on a leaderboard, and select a winner."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
